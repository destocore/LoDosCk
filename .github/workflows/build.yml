name: Java CI/CD with Maven

on:
  push:
    branches: [ "velocity-4.3.1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload compiled plugin .jar to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LoDosCk-Plugin
        path: target/*.jar

    - name: Upload .jar to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "velocity-4.3.1-build-${{ github.run_number }}"
        name: "Release Build for velocity-4.3.1 #${{ github.run_number }}"
        draft: false
        prerelease: false
        files: target/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
